<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        System Tron Credential QR Generator
    </title>

    <link
        rel="stylesheet"
        href="qr-generator.css"
    >

</head>


<body>

    <main class="container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="header">

            <div class="company-tag">
                ST
            </div>

            <h1>
                System Tron
            </h1>

            <p class="subtitle">
                Credential QR Generator
            </p>

        </header>


        <!-- =====================================
             CREDENTIAL ID
        ====================================== -->

        <section class="form-section">

            <label for="credentialId">
                CREDENTIAL ID
            </label>

            <input
                id="credentialId"
                type="text"
                value="ST-2026-001"
                placeholder="Example: ST-2026-001"
            >

        </section>


        <!-- =====================================
             GENERATE BUTTON
        ====================================== -->

        <button
            id="generateButton"
            type="button"
            onclick="generateQR()"
        >

            Generate QR Code

        </button>


        <!-- =====================================
             QR CODE
        ====================================== -->

        <div
            id="qrcode"
            class="qrcode"
        ></div>


        <!-- =====================================
             VERIFICATION URL
        ====================================== -->

        <div
            id="verificationUrl"
            class="url"
        ></div>


        <!-- =====================================
             NOTICE
        ====================================== -->

        <p class="notice">
            DEMONSTRATION CREDENTIAL
        </p>


    </main>


    <!-- =========================================
         QR CODE LIBRARY
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>


    <!-- =========================================
         QR GENERATOR JAVASCRIPT
    ========================================== -->

    <script>

        function generateQR() {

            const input =
                document.getElementById(
                    "credentialId"
                );


            const id =
                input.value.trim();


            // Check empty ID

            if (!id) {

                alert(
                    "Please enter a credential ID."
                );

                return;
            }


            /*
                IMPORTANT:

                The QR opens verify.html
                and passes the ID through
                the URL.
            */

            const verificationURL =
                window.location.origin +
                "/verify.html?id=" +
                encodeURIComponent(id);


            // Remove previous QR

            const qrContainer =
                document.getElementById(
                    "qrcode"
                );


            qrContainer.innerHTML = "";


            // Generate QR

            new QRCode(

                qrContainer,

                {

                    text:
                        verificationURL,

                    width:
                        250,

                    height:
                        250,

                    colorDark:
                        "#000000",

                    colorLight:
                        "#ffffff",

                    correctLevel:
                        QRCode.CorrectLevel.H

                }

            );


            // Display verification URL

            document.getElementById(
                "verificationUrl"
            ).textContent =
                verificationURL;

        }


        /*
            Generate default QR
            when page opens.
        */

        window.addEventListener(
            "DOMContentLoaded",
            generateQR
        );


    </script>


</body>

</html>
